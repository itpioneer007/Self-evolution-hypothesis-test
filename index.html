<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出题工作台 · Self-Evolution Hypothesis Test</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-title">出题工作台</div>
      <div class="brand-sub" id="brandSub">S-001 · U1 My classroom · 第 1 轮</div>
    </div>
    <div class="controls">
      <select id="unitSelect" class="unit-select" title="教材单元"></select>
      <div class="round-switch" id="roundSwitch">
        <button type="button" data-round="1" class="is-active">R1</button>
        <button type="button" data-round="2">R2</button>
      </div>
      <button type="button" id="exportBtn" class="btn btn-ghost">导出</button>
      <button type="button" id="resetBtn" class="btn btn-ghost">重置</button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="agents" class="tab is-active"><span class="tab-no">01</span>出题</button>
    <button type="button" data-tab="wrongbook" class="tab"><span class="tab-no">02</span>错题</button>
    <button type="button" data-tab="loop" class="tab"><span class="tab-no">03</span>日志</button>
  </nav>

  <main class="stage">

    <section class="stage-page is-active" id="page-agents">
      <aside class="agent-rail" id="agentRail"></aside>
      <div class="agent-work" id="agentPanel"></div>
    </section>

    <section class="stage-page" id="page-wrongbook">
      <div class="list-head">
        <h2>学生错题</h2>
        <span id="wrongSummary" class="list-count"></span>
      </div>
      <div id="wrongList" class="wrong-list"></div>
      <details class="fold" id="addWrongFold">
        <summary>新增错题</summary>
        <div id="addWrongForm" class="add-form"></div>
      </details>
    </section>

    <section class="stage-page" id="page-loop">
      <div class="kpi-row" id="metrics"></div>

      <div class="log-layout">
        <div class="card log-card">
          <div class="card-head"><h3>出题日志</h3><span id="logCount"></span></div>
          <div id="logFeed" class="log-feed"></div>
        </div>
        <div class="card chart-card">
          <div class="card-head"><h3>打回缘由</h3><span>按条款统计</span></div>
          <div id="rejectChart" class="chart"></div>
          <div class="card-head is-sub"><h3>已占用角度</h3><span id="usedCount"></span></div>
          <div id="usedCells" class="used-cells"></div>
        </div>
      </div>

      <div class="card stop-card">
        <div class="card-head"><h3>停止决策</h3><span>勾选并填写依据</span></div>
        <div id="stopPanel" class="stop-inline"></div>
      </div>
    </section>

  </main>

  <footer class="footbar">
    <span id="footStatus"></span>
    <span class="foot-hint">本地保存 · 不接模型</span>
  </footer>

</div>

<script src="src/data/textbook.js"></script>
<script src="src/data/curriculum.js"></script>
<script src="src/data/knowledgePoints.js"></script>
<script src="src/data/wrongCases.js"></script>
<script src="src/core/enums.js"></script>
<script src="src/core/fingerprint.js"></script>
<script src="src/core/checklist.js"></script>
<script src="src/core/wrongBook.js"></script>
<script src="src/app.js"></script>
</body>
</html>
